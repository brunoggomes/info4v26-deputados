<h1 class="titulo">Deputados</h1>

<div class="deputados">
    @for(dep of deputados(); track dep.id) {
        <div class="card-deputado">
            <p><img [src]="dep.urlFoto" alt=""></p>
            <p>{{dep.nome}}-{{dep.id}}</p>
            <p>{{dep.siglaPartido}} - 
               {{dep.siglaUf}}
            </p>
        </div>
    }
</div>
